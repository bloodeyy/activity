<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moon Activity</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111214;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            text-align: center;
            padding: 30px;
        }

        h1 {
            margin-bottom: 12px;
        }

        #status {
            white-space: pre-line;
            opacity: 0.75;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Moon</h1>
        <p id="status">HTML loaded ✅</p>
    </div>

    <script type="module">

        const status = document.getElementById("status");

        status.textContent = "JavaScript loaded ✅";

        async function start() {

            try {

                status.textContent = "Loading Discord SDK...";

                const module = await import(
                    "https://esm.sh/@discord/embedded-app-sdk@2.5.0"
                );

                status.textContent = "Discord SDK loaded ✅";

                const { DiscordSDK } = module;

                const CLIENT_ID = "1510641116528250990";

                const discordSdk = new DiscordSDK(CLIENT_ID);

                status.textContent = "Connecting to Discord...";

                await discordSdk.ready();

                status.textContent = "Discord Connected ✅";

                console.log("Moon Activity connected!");
                console.log("Instance ID:", discordSdk.instanceId);

            } catch (error) {

                console.error("Moon Activity error:", error);

                status.textContent =
                    "ERROR ❌\n\n" +
                    (error?.message || String(error));
            }
        }

        start();

    </script>

</body>
</html>

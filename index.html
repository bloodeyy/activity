<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moon Activity</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111214;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: min(90%, 600px);
            text-align: center;
        }

        .logo {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 42px;
        }

        .subtitle {
            margin-top: 10px;
            color: #a0a0a0;
        }

        .status {
            margin-top: 30px;
            padding: 18px;
            border-radius: 14px;
            background: #1b1c20;
            border: 1px solid #292a30;
        }

        #status {
            color: #57f287;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🌙</div>

        <h1>Moon</h1>

        <p class="subtitle">
            Your all-in-one Discord companion
        </p>

        <div class="status">
            <div id="status">
                Connecting to Discord...
            </div>
        </div>

    </div>

    <script type="module">

        import {
            DiscordSDK
        } from "https://esm.sh/@discord/embedded-app-sdk@2.5.0";

        const CLIENT_ID = "1510641116528250990";

        const API_URL =
            "https://moon-api.bloodeystill90.workers.dev";

        const status =
            document.getElementById("status");

        const discordSdk =
            new DiscordSDK(CLIENT_ID);


        async function start() {

            try {

                status.textContent =
                    "Connecting to Discord...";


                // 1. Wait for Discord Activity
                await discordSdk.ready();


                status.textContent =
                    "Authorizing...";


                // 2. Authorize user
                const { code } =
                    await discordSdk.commands.authorize({

                        client_id: CLIENT_ID,

                        response_type: "code",

                        state: "",

                        prompt: "none",

                        scope: [
                            "identify",
                            "rpc.activities.write"
                        ]

                    });


                console.log(
                    "Authorization code received"
                );


                status.textContent =
                    "Authenticating...";


                // 3. Send code to Cloudflare Worker
                const response =
                    await fetch(
                        `${API_URL}/api/token`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                code
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data?.error ||
                        "Token server error"
                    );

                }


                if (!data.access_token) {

                    throw new Error(
                        "No access token received"
                    );

                }


                console.log(
                    "Access token received"
                );


                // 4. Authenticate Activity
                await discordSdk.commands.authenticate({

                    access_token:
                        data.access_token

                });


                console.log(
                    "Moon Activity authenticated!"
                );


                status.textContent =
                    "Setting Rich Presence...";


                // 5. Set Rich Presence
                await discordSdk.commands.setActivity({

                    activity: {

                        type: 0,

                        details:
                            "Moon — Your all-in-one Discord companion",

                        state:
                            "Using Moon Activity",

                        timestamps: {
                            start: Date.now()
                        }

                    }

                });


                console.log(
                    "RPC SET SUCCESSFULLY 🔥"
                );


                status.textContent =
                    "● Moon Rich Presence Active 🔥";


            } catch (error) {

                console.error(
                    "Moon Activity error:",
                    error
                );


                status.textContent =
                    "❌ " +
                    (
                        error?.message ||
                        "Unknown error"
                    );

            }

        }


        start();

    </script>

</body>
</html>

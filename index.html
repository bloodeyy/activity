<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moon Activity</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111214;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: min(90%, 600px);
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            border-radius: 24px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 42px;
        }

        .subtitle {
            margin-top: 10px;
            color: #a0a0a0;
        }

        .status {
            margin-top: 30px;
            padding: 18px;
            border-radius: 14px;
            background: #1b1c20;
            border: 1px solid #292a30;
        }

        .connected {
            color: #57f287;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            🌙
        </div>

        <h1>Moon</h1>

        <p class="subtitle">
            Your all-in-one Discord companion
        </p>

        <div class="status">
            <div class="connected">
                ● Discord Connected
            </div>
        </div>

    </div>

    <script type="module">
        import {
            DiscordSDK
        } from "https://esm.sh/@discord/embedded-app-sdk@2.5.0";

        const CLIENT_ID = "1510641116528250990";

        const discordSdk = new DiscordSDK(CLIENT_ID);

        async function start() {
            try {

                await discordSdk.ready();

                console.log("Moon Activity connected!");
                console.log("Instance ID:", discordSdk.instanceId);

            } catch (error) {

                console.error(
                    "Moon Activity connection failed:",
                    error
                );

            }
        }

        start();
    </script>

</body>
</html>
